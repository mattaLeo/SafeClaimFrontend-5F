<!-- Overlay -->
<div class="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-center justify-center px-4">

  <div class="w-full max-w-sm bg-white rounded-[32px] shadow-2xl border border-[#7AB2B2]/30 p-8 relative"
       (click)="$event.stopPropagation()">

    <!-- X chiudi in alto a destra -->
    <button type="button" (click)="closed.emit()"
      class="absolute top-5 right-5 w-8 h-8 flex items-center justify-center rounded-full
             bg-[#EBF4F6] hover:bg-red-100 hover:text-red-500 text-slate-500 transition-all">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
        <path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708z"/>
      </svg>
    </button>

    <!-- Header -->
    <div class="flex flex-col items-center mb-7">
      <div class="bg-[#09637E] p-3 rounded-2xl shadow-lg shadow-[#7AB2B2]/40 mb-4">
        <i class="bi bi-person-plus-fill text-white text-xl"></i>
      </div>
      <h2 class="text-xl font-black tracking-tight text-[#061E29]">Nuovo Cliente</h2>
      <p class="text-xs text-slate-400 font-medium mt-1">Registra un nuovo automobilista</p>
    </div>

    <!-- Form -->
    <div class="flex flex-col gap-4">

      <!-- Nome + Cognome -->
      <div class="grid grid-cols-2 gap-3">
        <div class="flex flex-col gap-1.5">
          <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest">Nome</label>
          <input type="text" [(ngModel)]="nuovoCliente.nome" placeholder="Nome"
            class="w-full px-3 py-2.5 text-sm rounded-xl border border-[#7AB2B2]/50 bg-[#F4F4F4]
                   text-slate-800 placeholder-slate-300 font-medium focus:outline-none
                   focus:ring-2 focus:ring-[#09637E]/20 focus:border-[#09637E] transition-all" />
        </div>
        <div class="flex flex-col gap-1.5">
          <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest">Cognome</label>
          <input type="text" [(ngModel)]="nuovoCliente.cognome" placeholder="Cognome"
            class="w-full px-3 py-2.5 text-sm rounded-xl border border-[#7AB2B2]/50 bg-[#F4F4F4]
                   text-slate-800 placeholder-slate-300 font-medium focus:outline-none
                   focus:ring-2 focus:ring-[#09637E]/20 focus:border-[#09637E] transition-all" />
        </div>
      </div>

      <!-- CF -->
      <div class="flex flex-col gap-1.5">
        <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest">Codice Fiscale</label>
        <input type="text" [(ngModel)]="nuovoCliente.cf" placeholder="RSSMRA80A01H501U"
          class="w-full px-3 py-2.5 text-sm rounded-xl border border-[#7AB2B2]/50 bg-[#F4F4F4]
                 text-slate-800 placeholder-slate-300 font-medium uppercase focus:outline-none
                 focus:ring-2 focus:ring-[#09637E]/20 focus:border-[#09637E] transition-all" />
      </div>

      <!-- Email -->
      <div class="flex flex-col gap-1.5">
        <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest">Email</label>
        <input type="email" [(ngModel)]="nuovoCliente.email" placeholder="cliente@example.com"
          class="w-full px-3 py-2.5 text-sm rounded-xl border border-[#7AB2B2]/50 bg-[#F4F4F4]
                 text-slate-800 placeholder-slate-300 font-medium focus:outline-none
                 focus:ring-2 focus:ring-[#09637E]/20 focus:border-[#09637E] transition-all" />
      </div>

      <!-- Telefono — solo cifre, +, spazi -->
      <div class="flex flex-col gap-1.5">
        <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest">Telefono</label>
        <div class="relative">
          <svg class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" xmlns="http://www.w3.org/2000/svg"
               width="15" height="15" fill="currentColor" viewBox="0 0 16 16">
            <path d="M3.654 1.328a.678.678 0 0 0-1.015-.063L1.605 2.3c-.483.484-.661 1.169-.45 1.77a17.568 17.568 0 0 0 4.168 6.608 17.569 17.569 0 0 0 6.608 4.168c.601.211 1.286.033 1.77-.45l1.034-1.034a.678.678 0 0 0-.063-1.015l-2.307-1.794a.678.678 0 0 0-.58-.122l-2.19.547a1.745 1.745 0 0 1-1.657-.459L5.482 8.062a1.745 1.745 0 0 1-.46-1.657l.548-2.19a.678.678 0 0 0-.122-.58L3.654 1.328z"/>
          </svg>
          <input type="tel" [(ngModel)]="nuovoCliente.telefono"
            placeholder="+39 333 1234567"
            (keypress)="soloNumeri($event)"
            class="w-full pl-9 pr-3 py-2.5 text-sm rounded-xl border border-[#7AB2B2]/50 bg-[#F4F4F4]
                   text-slate-800 placeholder-slate-300 font-medium focus:outline-none
                   focus:ring-2 focus:ring-[#09637E]/20 focus:border-[#09637E] transition-all" />
        </div>
      </div>

      <!-- Password temporanea -->
      <div class="flex flex-col gap-1.5">
        <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest">Password Temporanea</label>
        <div class="relative flex items-center">
          <input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="nuovoCliente.password"
            placeholder="••••••••"
            class="w-full pl-3 pr-12 py-2.5 text-sm rounded-xl border border-[#7AB2B2]/50 bg-[#F4F4F4]
                   text-slate-800 placeholder-slate-300 font-medium focus:outline-none
                   focus:ring-2 focus:ring-[#09637E]/20 focus:border-[#09637E] transition-all" />
          <button type="button" (click)="showPassword = !showPassword"
            class="absolute right-0 w-11 h-full flex items-center justify-center
                   text-slate-400 hover:text-[#09637E] transition-colors rounded-r-xl">
            <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
              <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8zM1.173 8a13.133 13.133 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13.133 13.133 0 0 1 14.828 8c-.058.087-.122.183-.195.288-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5c-2.12 0-3.879-1.168-5.168-2.457A13.134 13.134 0 0 1 1.172 8z"/>
              <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0z"/>
            </svg>
            <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
              <path d="M13.359 11.238C15.06 9.72 16 8 16 8s-3-5.5-8-5.5a7.028 7.028 0 0 0-2.79.588l.77.771A5.944 5.944 0 0 1 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13.134 13.134 0 0 1 14.828 8c-.058.087-.122.183-.195.288-.335.48-.83 1.12-1.465 1.755-.165.165-.337.328-.517.486l.708.709z"/>
              <path d="M11.297 9.176a3.5 3.5 0 0 0-4.474-4.474l.823.823a2.5 2.5 0 0 1 2.829 2.829l.822.822zm-2.943 1.299.822.822a3.5 3.5 0 0 1-4.474-4.474l.823.823a2.5 2.5 0 0 0 2.829 2.829z"/>
              <path d="M3.35 5.47c-.18.16-.353.322-.518.487A13.134 13.134 0 0 0 1.172 8l.195.288c.335.48.83 1.12 1.465 1.755C4.121 11.332 5.881 12.5 8 12.5c.716 0 1.39-.133 2.02-.36l.77.772A7.029 7.029 0 0 1 8 13.5C3 13.5 0 8 0 8s.939-1.721 2.641-3.238l.708.709z"/>
              <path d="M13.646 14.354l-12-12 .708-.708 12 12-.708.708z"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Hint -->
      <div class="flex items-start gap-2 px-3 py-2.5 bg-amber-50 border border-amber-200 rounded-xl text-xs text-amber-700 font-medium">
        <i class="bi bi-info-circle shrink-0 mt-0.5 text-amber-500"></i>
        <span>Il cliente riceverà le credenziali e dovrà cambiare la password al primo accesso.</span>
      </div>

      <!-- Errore -->
      <div *ngIf="errorMessage"
        class="flex items-center gap-2 px-4 py-3 bg-red-50 border border-red-100 rounded-xl text-red-600 text-xs font-semibold">
        <i class="bi bi-exclamation-circle shrink-0"></i>
        {{ errorMessage }}
      </div>

      <!-- Successo -->
      <div *ngIf="successMessage"
        class="flex items-center gap-2 px-4 py-3 bg-green-50 border border-green-100 rounded-xl text-green-700 text-xs font-semibold">
        <i class="bi bi-check-circle shrink-0"></i>
        {{ successMessage }}
      </div>

      <!-- Azioni — solo Registra, niente Annulla -->
      <div class="pt-1">
        <button type="button" (click)="registraCliente()" [disabled]="!formValido || loading"
          class="w-full py-2.5 text-xs font-black text-white bg-[#09637E] rounded-xl
                 hover:bg-[#088395] transition-all uppercase tracking-widest shadow-lg shadow-[#09637E]/20
                 disabled:opacity-60 disabled:cursor-not-allowed flex items-center justify-center gap-2">
          <i *ngIf="loading" class="bi bi-arrow-repeat animate-spin"></i>
          {{ loading ? 'Registrazione...' : 'Registra Cliente' }}
        </button>
      </div>

    </div>
  </div>
</div>
